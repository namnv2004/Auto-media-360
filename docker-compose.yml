services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: automedia_backend
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/automedia
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app

  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: automedia_worker
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/automedia
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A api.core.celery_app worker --loglevel=info
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: automedia_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - node_modules/

  db:
    image: postgres:16-alpine
    container_name: automedia_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automedia
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: automedia_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
